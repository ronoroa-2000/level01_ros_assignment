amcl:
  ros__parameters:
    use_sim_time: true

    # Frames
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # Sensor model (tuned to match the simulated gpu_lidar in testbed.gazebo)
    scan_topic: scan
    laser_model_type: "likelihood_field"
    laser_min_range: 0.10
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Motion model (differential drive)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_a: 0.2
    update_min_d: 0.25

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Misc
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    map_topic: map
    first_map_only: false
    always_reset_initial_pose: false

    # Seed the filter at the robot's known simulation spawn pose
    # (x=0.0, y=5.0, yaw=0.0 in spawn_testbed.launch.py). Operators can still
    # override this at runtime with RViz's "2D Pose Estimate" tool.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
